<style>
  :root{
    --bg: #EDE7DA;
    --surface: #F7F2E9;
    --surface-2: #FBF8F2;
    --ink: #2E2A22;
    --ink-soft: #6B6355;
    --line: #D8CFBD;
    --glaze: #4F6B58;
    --glaze-dark: #3B5142;
    --oxide: #B5602F;
    --oxide-soft: #F1DFCF;
    --ok-bg: #E4EBE3;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Work Sans', system-ui, sans-serif;
    font-size:16px;
    line-height:1.5;
    min-height:100vh;
  }
  h1,h2,h3{
    font-family:'Fraunces', Georgia, serif;
    font-weight:600;
    margin:0 0 4px 0;
    letter-spacing:-0.01em;
  }
  #app{
    max-width:640px;
    margin:0 auto;
    padding:20px 16px 60px 16px;
    min-height:100vh;
  }
  .topbar{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:22px;
    padding-bottom:14px;
    border-bottom:2px solid var(--ink);
  }
  .topbar h1{font-size:1.35rem;}
  .topbar .sub{color:var(--ink-soft); font-size:0.85rem;}
  button{

<body>
<div id="app"><p style="padding:40px; text-align:center; color:#6B6355;">Cargando…</p></div>

<script>
const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const DIAS_CORTO = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

const THEMES = {
  arcilla: {
    name: 'Arcilla', bg:'#EDE7DA', surface:'#F7F2E9', surface2:'#FBF8F2',
    ink:'#2E2A22', inkSoft:'#6B6355', line:'#D8CFBD',
    glaze:'#4F6B58', glazeDark:'#3B5142', oxide:'#B5602F', oxideSoft:'#F1DFCF', okBg:'#E4EBE3'
  },
  terracota: {
    name: 'Terracota', bg:'#F2E4D8', surface:'#FAF1E7', surface2:'#FFF8F0',
    ink:'#3A2A1E', inkSoft:'#8A6F5C', line:'#E0C7AE',
    glaze:'#A8552E', glazeDark:'#7E3D1E', oxide:'#5C6B4F', oxideSoft:'#E9EDE0', okBg:'#EFE6D6'
  },
  piedra: {
    name: 'Piedra', bg:'#E8E6E1', surface:'#F3F1EC', surface2:'#FAF9F6',
    ink:'#23262B', inkSoft:'#6B6F76', line:'#D3D0C9',
    glaze:'#3D5A73', glazeDark:'#2A4054', oxide:'#A6462F', oxideSoft:'#EFDCD3', okBg:'#E1E7E2'
  },
  musgo: {
    name: 'Musgo', bg:'#E4E3D3', surface:'#EFEEDF', surface2:'#F7F6EC',
    ink:'#23281D', inkSoft:'#6E7259', line:'#CFCDB4',
    glaze:'#566B3D', glazeDark:'#3E4E2C', oxide:'#B4622E', oxideSoft:'#F1DFC9', okBg:'#DEE6D2'
  },
  florar: {
    name: 'Florar', bg:'#EEE9F2', surface:'#F7F4FA', surface2:'#FCFAFD',
    ink:'#2B2233', inkSoft:'#6E5F7A', line:'#DCD2E6',
    glaze:'#4B3B63', glazeDark:'#352748', oxide:'#A6446B', oxideSoft:'#F1DCE5', okBg:'#E4DCEE'
  }
};
function applyTheme(key){
  const t = THEMES[key] || THEMES.florar;
  const r = document.documentElement.style;
  r.setProperty('--bg', t.bg);
  r.setProperty('--surface', t.surface);
  r.setProperty('--surface-2', t.surface2);
  r.setProperty('--ink', t.ink);
  r.setProperty('--ink-soft', t.inkSoft);
  r.setProperty('--line', t.line);
  r.setProperty('--glaze', t.glaze);
  r.setProperty('--glaze-dark', t.glazeDark);
  r.setProperty('--oxide', t.oxide);
  r.setProperty('--oxide-soft', t.oxideSoft);
  r.setProperty('--ok-bg', t.okBg);
}

let state = {
  config: null,
  holidays: [],
  students: {},
  overrides: {},
  extraBookings: {},
  announcements: [],
  admins: {},
  pinResets: [],
  activities: [],
  studentInfo: '',
  slotAssignments: {},
  swapNotifications: [],
  substitutions: {},
  session: { role: null, studentId: null }
};

// ---------- storage helpers ----------
async function loadShared(key, fallback){
  try{
    const res = await window.storage.get(key, true);
    return res ? JSON.parse(res.value) : fallback;
  }catch(e){ return fallback; }
}
async function saveShared(key, value){
  try{
    await window.storage.set(key, JSON.stringify(value), true);
    return true;
  }catch(e){ console.error('Error guardando', key, e); return false; }
}
async function sha256(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

function defaultConfig(){
  return {
    slotsWeekday: [
      {id:'w1', start:'10:30', end:'12:30'},
      {id:'w2', start:'13:00', end:'15:00'},
      {id:'w3', start:'15:30', end:'17:30'},
      {id:'w4', start:'18:00', end:'20:00'}
    ],
    slotsSaturday: [
      {id:'s1', start:'11:00', end:'13:00'},
      {id:'s2', start:'14:00', end:'16:00'}
    ],
    capacity: 8,
    classesPerCycle: 4,
    swapsPerMonth: 1,
    paymentWindowStart: 1,
    paymentWindowEnd: 10,
    studioName: 'Taller de Cerámica',
    monthlyFee: 15000,
    mpLink: '',
    theme: 'florar',
    defaultStudentPin: '0000',
    profeWhatsapp: '',
    announcementVisibleDays: 7
  };
}

async function loadAll(){
  const [config, holidays, students, overrides, extraBookings, announcements, admins, pinResets, activities, studentInfo, slotAssignments, swapNotifications, substitutions] = await Promise.all([
    loadShared('config', null),
    loadShared('holidays', []),
    loadShared('students', {}),
    loadShared('overrides', {}),
    loadShared('extraBookings', {}),
    loadShared('announcements', []),
    loadShared('admins', {}),
    loadShared('pinResets', []),
    loadShared('activities', []),
    loadShared('studentInfo', ''),
    loadShared('slotAssignments', {}),
    loadShared('swapNotifications', []),
    loadShared('substitutions', {})
  ]);
  state.config = Object.assign(defaultConfig(), config || {});
  state.holidays = holidays || [];
  state.students = students || {};
  state.overrides = overrides || {};
  state.extraBookings = extraBookings || {};
  state.announcements = announcements || [];
  state.admins = admins || {};
  state.pinResets = pinResets || [];
  state.activities = activities || [];
  state.studentInfo = studentInfo || '';
  state.slotAssignments = slotAssignments || {};
  state.swapNotifications = swapNotifications || [];
  state.substitutions = substitutions || {};
  if(!config) await saveShared('config', state.config);
  applyTheme(state.config.theme);
}

async function persist(key){
  const map = {
    config: state.config, holidays: state.holidays, students: state.students,
    overrides: state.overrides, extraBookings: state.extraBookings,
    announcements: state.announcements, admins: state.admins, pinResets: state.pinResets,
    activities: state.activities, studentInfo: state.studentInfo,
    slotAssignments: state.slotAssignments, swapNotifications: state.swapNotifications,
    substitutions: state.substitutions
  };
  await saveShared(key, map[key]);
}

// ---------- date helpers ----------
function pad(n){ return n.toString().padStart(2,'0'); }
function isoDate(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function todayISO(){ return isoDate(new Date()); }
function parseISO(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function daysSince(dateISO){ return Math.floor((parseISO(todayISO()) - parseISO(dateISO)) / 86400000); }
function monthKeyOf(dateISO){ return dateISO.slice(0,7); }
function currentMonthKey(){ return monthKeyOf(todayISO()); }
function fmtLong(dateISO){
  const d = parseISO(dateISO);
  return `${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}`;
}
function fmtShort(dateISO){
  const d = parseISO(dateISO);
  return `${DIAS_CORTO[d.getDay()]} ${pad(d.getDate())}/${pad(d.getMonth()+1)}`;
}
function isHoliday(dateISO){
  return state.holidays.find(h => h.date === dateISO);
}
function activityForDate(dateISO){
  return state.activities.find(a => dateISO >= a.date && dateISO <= (a.endDate || a.date));
}
function slotAssignmentKey(weekday, slotId){ return `${weekday}_${slotId}`; }
function profeForSlot(weekday, slotId){ return state.slotAssignments[slotAssignmentKey(weekday, slotId)] || null; }
function substitutionKey(date, slotId){ return `${date}_${slotId}`; }
function profeForDateSlot(date, slotId){
  const key = substitutionKey(date, slotId);
  if(Object.prototype.hasOwnProperty.call(state.substitutions, key)) return state.substitutions[key] || null;
  return profeForSlot(parseISO(date).getDay(), slotId);
}
function profeAccounts(){ return Object.values(state.admins).filter(a => a.role === 'profe'); }
function linkify(text){
  return escapeHtml(text).replace(/\n/g, '<br>').replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
}
function slotsForDate(dateISO){
  const wd = parseISO(dateISO).getDay();
  if(wd === 0) return [];
  if(wd === 6) return state.config.slotsSaturday;
  return state.config.slotsWeekday;
}
function slotsForWeekday(wd){
  if(wd === 0) return [];
  if(wd === 6) return state.config.slotsSaturday;
  return state.config.slotsWeekday;
}
function slotById(dateISO, slotId){
  return slotsForDate(dateISO).find(s => s.id === slotId);
}
function slotStartDateTime(dateISO, slotId){
  const slot = slotById(dateISO, slotId);
  if(!slot) return null;
  const [h,m] = slot.start.split(':').map(Number);
  const d = parseISO(dateISO);
  d.setHours(h, m, 0, 0);
  return d;
}
function hoursUntil(dateISO, slotId){
  const dt = slotStartDateTime(dateISO, slotId);
  if(!dt) return -999;
  return (dt.getTime() - Date.now()) / 3600000;
}
function occurrencesInMonth(weekday, monthKey){
  const [y,m] = monthKey.split('-').map(Number);
  const dates = [];
  const d = new Date(y, m-1, 1);
  while(d.getMonth() === m-1){
    if(d.getDay() === weekday) dates.push(isoDate(d));
    d.setDate(d.getDate()+1);
  }
  return dates;
}
function nextDateForWeekday(weekday){
  const d = new Date();
  for(let i=0;i<7;i++){
    if(d.getDay() === weekday) return isoDate(d);
    d.setDate(d.getDate()+1);
  }
  return isoDate(d);
}
function slugify(name){
  return name.trim().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}
function mondayOf(dateISO){
  const d = parseISO(dateISO);
  const wd = d.getDay();
  const diff = wd === 0 ? -6 : 1 - wd;
  d.setDate(d.getDate() + diff);
  return isoDate(d);
}
function addDays(dateISO, n){
  const d = parseISO(dateISO);
  d.setDate(d.getDate()+n);
  return isoDate(d);
}
function money(n){
  return '$' + Number(n||0).toLocaleString('es-AR');
}

// ---------- domain logic ----------
function slotOccupancy(dateISO, slotId, excludeStudentId){
  let names = [];
  const wd = parseISO(dateISO).getDay();
  for(const sid in state.students){
    if(sid === excludeStudentId) continue;
    const s = state.students[sid];
    if(s.defaultWeekday === wd && s.defaultSlotId === slotId){
      const ov = (state.overrides[sid] || {})[dateISO];
      if(!(ov && ov.cancelled)) names.push(s.name);
    }
  }
  for(const sid in state.extraBookings){
    if(sid === excludeStudentId) continue;
    (state.extraBookings[sid] || []).forEach(b => {
      if(b.date === dateISO && b.slotId === slotId) names.push(state.students[sid]?.name || '?');
    });
  }
  return names;
}
function weekdayOccupancyCount(weekday, slotId, excludeStudentId){
  return slotOccupancy(nextDateForWeekday(weekday), slotId, excludeStudentId).length;
}
function studentSessionsThisMonth(sid){
  const s = state.students[sid];
  const mk = currentMonthKey();
  const dates = occurrencesInMonth(s.defaultWeekday, mk);
  const rows = [];
  dates.forEach(date => {
    const ov = (state.overrides[sid] || {})[date];
    if(ov && ov.cancelled){
      rows.push({date, slotId: s.defaultSlotId, status: ov.reason === 'feriado' ? 'moved-holiday' : 'moved-swap', movedTo: ov.movedTo});
    } else if(isHoliday(date)){
      rows.push({date, slotId: s.defaultSlotId, status: 'pending-holiday'});
    } else {
      rows.push({date, slotId: s.defaultSlotId, status: 'confirmed'});
    }
  });
  (state.extraBookings[sid] || []).forEach(b => {
    if(monthKeyOf(b.date) === mk){
      rows.push({date: b.date, slotId: b.slotId, status: 'rescheduled', from: b.fromDate});
    }
  });
  rows.sort((a,b) => a.date.localeCompare(b.date) || a.slotId.localeCompare(b.slotId));
  return rows;
}
function swapsUsedThisMonth(sid){
  const s = state.students[sid];
  return (s.swapsUsed || {})[currentMonthKey()] || 0;
}
function studentFee(sid){
  const s = state.students[sid];
  return (s.feeOverride !== undefined && s.feeOverride !== null && s.feeOverride !== '') ? s.feeOverride : state.config.monthlyFee;
}
function isUnpaid(sid){
  const s = state.students[sid];
  return !(s.paidMonths || {})[currentMonthKey()];
}
function dayAvailability(date){
  if(isHoliday(date)) return 'holiday';
  const slots = slotsForDate(date);
  if(!slots.length) return 'closed';
  const anyRoom = slots.some(s => slotOccupancy(date, s.id).length < state.config.capacity);
  return anyRoom ? 'available' : 'full';
}

// Calendario mensual reutilizable. mode: 'swap' (solo se pueden elegir días con lugar,
// para pedir un cambio) o 'browse' (ver el mes completo sin anotarse desde acá).
function renderMonthCalendar(container, opts){
  const mode = opts.mode || 'browse';
  const today = todayISO();
  const mk = currentMonthKey();
  const [y, m] = mk.split('-').map(Number);
  const firstDay = new Date(y, m-1, 1);
  const daysInMonth = new Date(y, m, 0).getDate();
  const startWeekday = firstDay.getDay();
  let cells = '';
  for(let i = 0; i < startWeekday; i++) cells += '<div class="cal-cell empty"></div>';
  for(let day = 1; day <= daysInMonth; day++){
    const date = `${y}-${pad(m)}-${pad(day)}`;
    const isPastForMode = mode === 'swap' ? date <= today : date < today;
    let status;
    if(parseISO(date).getDay() === 0) status = 'closed';
    else if(isPastForMode) status = 'past';
    else status = dayAvailability(date);
    const activity = activityForDate(date);
    let clickable = mode === 'swap' ? status === 'available' : (status === 'available' || status === 'full' || status === 'holiday');
    if(mode !== 'swap' && activity) clickable = true;
    const sel = opts.selectedDate === date;
    cells += `<div class="cal-cell ${status} ${sel?'selected':''}" ${clickable ? `data-date="${date}"` : ''}>${day}${activity ? '<span class="activity-dot" title="actividad"></span>' : ''}</div>`;
  }
  container.innerHTML = `
    <div class="cal-grid cal-header">${['D','L','M','M','J','V','S'].map(d => `<div class="cal-h">${d}</div>`).join('')}</div>
    <div class="cal-grid">${cells}</div>
    <div class="cal-legend">
      <span><span class="dot available"></span>con lugar</span>
      <span><span class="dot full"></span>lleno</span>
      <span><span class="dot holiday"></span>feriado</span>
      <span><span class="activity-dot" style="position:static; display:inline-block; box-shadow:none;"></span> actividad</span>
    </div>
  `;
  container.querySelectorAll('[data-date]').forEach(el => {
    el.onclick = () => opts.onSelect(el.dataset.date);
  });
}

// Calendario del alumno: el mismo calendario del taller, pero con SUS clases marcadas
// con un puntito. Tocar un día suyo abre la acción (cambiar / reprogramar); tocar
// cualquier otro día solo muestra la ocupación, para saber dónde hay lugar.
function renderStudentMonthCalendar(container, sid){
  const sessions = studentSessionsThisMonth(sid);
  const ownMap = {};
  sessions.forEach(r => { ownMap[r.date] = r; });
  const today = todayISO();
  const mk = currentMonthKey();
  const [y, m] = mk.split('-').map(Number);
  const firstDay = new Date(y, m-1, 1);
  const daysInMonth = new Date(y, m, 0).getDate();
  const startWeekday = firstDay.getDay();
  let cells = '';
  for(let i = 0; i < startWeekday; i++) cells += '<div class="cal-cell empty"></div>';
  for(let day = 1; day <= daysInMonth; day++){
    const date = `${y}-${pad(m)}-${pad(day)}`;
    const own = ownMap[date];
    const isPast = date <= today;
    let cls;
    if(own){
      cls = (own.status === 'moved-swap' || own.status === 'moved-holiday') ? 'moved'
          : (own.status === 'pending-holiday') ? 'holiday'
          : (date < today) ? 'attended'
          : 'available';
    } else if(parseISO(date).getDay() === 0){
      cls = 'closed';
    } else if(isPast){
      cls = 'past';
    } else {
      cls = dayAvailability(date);
    }
    const clickable = !!own || cls === 'available' || cls === 'full' || cls === 'holiday' || !!activityForDate(date);
    cells += `<div class="cal-cell ${cls}" ${clickable ? `data-date="${date}"` : ''}>${day}${own ? '<span class="own-dot"></span>' : ''}${activityForDate(date) ? '<span class="activity-dot" title="actividad"></span>' : ''}</div>`;
  }
  container.innerHTML = `
    <div class="cal-grid cal-header">${['D','L','M','M','J','V','S'].map(d => `<div class="cal-h">${d}</div>`).join('')}</div>
    <div class="cal-grid">${cells}</div>
    <div class="cal-legend">
      <span><span class="own-dot" style="position:static; display:inline-block; background:var(--ink);"></span> tu clase</span>
      <span><span class="dot available"></span>con lugar</span>
      <span><span class="dot full"></span>lleno</span>
      <span><span class="dot holiday"></span>feriado</span>
      <span><span class="activity-dot" style="position:static; display:inline-block; box-shadow:none;"></span> actividad</span>
    </div>
  `;
  container.querySelectorAll('[data-date]').forEach(el => {
    el.onclick = () => {
      const date = el.dataset.date;
      if(ownMap[date]) openOwnSessionModal(sid, date, ownMap[date]);
      else openDayInfoModal(date);
    };
  });
}

function openOwnSessionModal(sid, date, row){
  const slot = slotById(date, row.slotId) || {};
  const profe = profeForDateSlot(date, row.slotId);
  const swapsLeft = state.config.swapsPerMonth - swapsUsedThisMonth(sid);
  let body = '', actionBtn = '';
  if(row.status === 'confirmed'){
    const hrs = hoursUntil(date, row.slotId);
    const future = hrs > 0;
    body = `<p class="muted">${slot.start||''}–${slot.end||''}${profe ? ' · profe: '+profe : ''}</p><span class="tag ok">confirmada</span>`;
    if(future){
      const eligible = hrs >= 24 && swapsLeft > 0;
      actionBtn = `<button class="primary block" id="own-action" style="margin-top:14px;" ${eligible?'':'disabled'}>Cambiar este turno</button>`;
      if(!eligible){
        body += `<p class="hint">${hrs < 24 ? 'Ya no se puede: falta menos de 24hs.' : 'Ya usaste tu cambio de este mes.'}</p>`;
      }
    } else {
      body += `<p class="hint">Ya se dictó esta clase.</p>`;
    }
  } else if(row.status === 'pending-holiday'){
    body = `<p class="muted">${slot.start||''}–${slot.end||''}</p><span class="tag warn">feriado — a reprogramar</span>`;
    actionBtn = `<button class="primary block" id="own-action" style="margin-top:14px;">Reprogramar</button>`;
  } else if(row.status === 'moved-swap' || row.status === 'moved-holiday'){
    body = `<p class="muted">${slot.start||''}–${slot.end||''}</p><span class="tag moved">movida a ${fmtLong(row.movedTo.date)}</span>`;
  } else if(row.status === 'rescheduled'){
    body = `<p class="muted">${slot.start||''}–${slot.end||''}</p><span class="tag moved">reprogramada (antes ${fmtLong(row.from)})</span>`;
  }
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal">
      <h3>${fmtLong(date)}</h3>
      ${activityInfoHtml(date)}
      ${body}
      ${actionBtn}
      <button class="ghost block" id="own-close" style="margin-top:10px;">Cerrar</button>
    </div>
  `;
  document.body.appendChild(backdrop);
  backdrop.querySelector('#own-close').onclick = () => backdrop.remove();
  const actionEl = backdrop.querySelector('#own-action');
  if(actionEl){
    actionEl.onclick = () => {
      backdrop.remove();
      openSwapModal(sid, date, row.status === 'pending-holiday');
    };
  }
}

function activityInfoHtml(date){
  const act = activityForDate(date);
  if(!act) return '';
  const range = act.endDate && act.endDate !== act.date ? `${fmtShort(act.date)} — ${fmtShort(act.endDate)}` : '';
  return `<div class="banner" style="background:#F6EAD1; border-color:#C9962E;">
    <strong>${escapeHtml(act.title)}</strong>
    ${range ? `<div class="muted" style="margin-bottom:4px;">${range}</div>` : ''}
    ${act.description ? linkify(act.description) : ''}
  </div>`;
}

function openDayInfoModal(date){
  const hol = isHoliday(date);
  const slots = slotsForDate(date);
  const rowsHtml = hol
    ? `<p class="muted">Feriado${hol.label ? ': '+escapeHtml(hol.label) : ''}. No hay clases este día.</p>`
    : slots.map(slot => {
        const occ = slotOccupancy(date, slot.id).length;
        const full = occ >= state.config.capacity;
        return `<div class="list-item"><span>${slot.start}–${slot.end}</span><span class="tag ${full?'warn':'ok'}">${occ}/${state.config.capacity}</span></div>`;
      }).join('');
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal">
      <h3>${fmtLong(date)}</h3>
      ${activityInfoHtml(date)}
      ${rowsHtml}
      <button class="ghost block" id="btn-close-day" style="margin-top:14px;">Cerrar</button>
    </div>
  `;
  document.body.appendChild(backdrop);
  backdrop.querySelector('#btn-close-day').onclick = () => backdrop.remove();
  backdrop.onclick = (e) => { if(e.target === backdrop) backdrop.remove(); };
}

function withinPaymentWindow(){
  const day = parseInt(todayISO().split('-')[2], 10);
  return day >= state.config.paymentWindowStart && day <= state.config.paymentWindowEnd;
}

    const wa = state.config.profeWhatsapp;
    const waMsg = encodeURIComponent(`Hola! Pedí restablecer mi PIN en la app del taller. Soy ${state.students[id].name}.`);

function handleStudentAuth(){
  const name = document.getElementById('in-name').value.trim();
  const pin = document.getElementById('in-pin').value.trim();
  const errEl = document.getElementById('auth-err');
  errEl.innerHTML = '';
  if(name.length < 2){ errEl.innerHTML = '<p class="err">Ingresá tu usuario.</p>'; return; }
  if(!pin){ errEl.innerHTML = '<p class="err">Ingresá tu PIN.</p>'; return; }
  const id = slugify(name);
  const existing = state.students[id];
  if(!existing || existing.pin !== pin){
    errEl.innerHTML = '<p class="err">No encontramos esa cuenta o el PIN no coincide. Consultá con la profesora.</p>';
    return;
  }
  state.session = {role:'student', studentId:id};
  render();
}

// ---------- reusable: weekday + slot picker (para turno fijo semanal) ----------
function renderWeekdaySlotPicker(container, opts){
  let selDay = opts.initialDay ?? null;
  let selSlot = opts.initialSlot ?? null;
  const dayOptions = [1,2,3,4,5,6];
  function paint(){
    const slotsHtml = selDay === null ? '' : (slotsForWeekday(selDay).map(slot => {
      const occ = weekdayOccupancyCount(selDay, slot.id, opts.excludeStudentId);
      const full = occ >= state.config.capacity;
      const isSel = selSlot === slot.id;
      return `<div class="chip ${isSel?'selected':''} ${full && !isSel ?'full':''}" data-slot="${slot.id}">${slot.start}–${slot.end} <span class="muted">(${occ}/${state.config.capacity})</span></div>`;
    }).join('') || '<p class="muted">Ese día no hay turnos configurados.</p>');
    container.innerHTML = `
      <div class="step-label">1. Elegí el día</div>
      <div class="chip-row">
        ${dayOptions.map(d => `<div class="chip ${selDay===d?'selected':''}" data-day="${d}">${DIAS_CORTO[d]}</div>`).join('')}
      </div>
      <div class="step-label">2. Elegí el horario</div>
      <div class="chip-row">${slotsHtml}</div>
    `;
    container.querySelectorAll('[data-day]').forEach(el => {
      el.onclick = () => { selDay = parseInt(el.dataset.day,10); selSlot = null; paint(); opts.onChange(selDay, selSlot); };
    });
    container.querySelectorAll('[data-slot]:not(.full)').forEach(el => {
      el.onclick = () => { selSlot = el.dataset.slot; paint(); opts.onChange(selDay, selSlot); };
    });
  }
  paint();
}

  const stepsEl = backdrop.querySelector('#swap-steps');
  const summaryEl = backdrop.querySelector('#swap-summary');
  let chosenDate = null, chosenSlot = null;
  function paintSteps(){
    const slotsHtml = chosenDate === null ? '' : (slotsForDate(chosenDate).map(slot => {
      const isSameAsOriginal = chosenDate === originalDate && slot.id === originalSlotId;
      const occ = slotOccupancy(chosenDate, slot.id, sid);
      const full = occ.length >= state.config.capacity;
      const hrs = hoursUntil(chosenDate, slot.id);
      const blocked = full || hrs < 24 || isSameAsOriginal;
      return `<div class="slot-option ${chosenSlot===slot.id?'selected':''} ${blocked?'full':''}" data-slot="${slot.id}">
        <span>${slot.start}–${slot.end}</span>
        <span class="muted">${isSameAsOriginal ? 'es la que estás cambiando' : occ.length+'/'+state.config.capacity}</span>
      </div>`;
    }).join('') || '<p class="muted">No hay turnos ese día.</p>');
    stepsEl.innerHTML = `
      <div class="step-label">1. Elegí el día (con lugar, dentro de este mes)</div>
      <div id="swap-calendar" style="margin-bottom:14px;"></div>
      <div class="step-label">2. Elegí el horario</div>
      <div>${slotsHtml}</div>
    `;
    renderMonthCalendar(stepsEl.querySelector('#swap-calendar'), {
      mode: 'swap',
      selectedDate: chosenDate,
      onSelect: (date) => { chosenDate = date; chosenSlot = null; paintSteps(); updateConfirm(); }
    });
    stepsEl.querySelectorAll('.slot-option:not(.full)').forEach(el => {
      el.onclick = () => { chosenSlot = el.dataset.slot; paintSteps(); updateConfirm(); };
    });
  }
  function updateConfirm(){
    backdrop.querySelector('#btn-confirm-swap').disabled = !(chosenDate && chosenSlot);
    if(chosenDate && chosenSlot){
      const slot = slotById(chosenDate, chosenSlot) || {};
      summaryEl.innerHTML = `<div class="banner" style="background:#E6E1F0; border-color:#584A7A; color:#584A7A;">
        <strong>Vas a mover esta clase a</strong>
        ${fmtLong(chosenDate)} · ${slot.start||''}–${slot.end||''}
      </div>`;
    } else {
      summaryEl.innerHTML = '';
    }
  }
  paintSteps();
  backdrop.querySelector('#btn-cancel-swap').onclick = () => backdrop.remove();
  backdrop.querySelector('#btn-confirm-swap').onclick = async () => {
    await confirmSwap(sid, originalDate, {date: chosenDate, slot: chosenSlot}, isHolidayReschedule);
    backdrop.remove();
    renderStudentDashboard();
  };
}

async function confirmSwap(sid, originalDate, target, isHolidayReschedule){
  const s = state.students[sid];
  const fromWeekday = s.defaultWeekday;
  const fromSlotId = s.defaultSlotId;
  const toWeekday = parseISO(target.date).getDay();
  if(!state.overrides[sid]) state.overrides[sid] = {};
  state.overrides[sid][originalDate] = {
    cancelled: true,
    reason: isHolidayReschedule ? 'feriado' : 'cambio',
    movedTo: { date: target.date, slotId: target.slot }
  };
  if(!state.extraBookings[sid]) state.extraBookings[sid] = [];
  state.extraBookings[sid].push({ date: target.date, slotId: target.slot, fromDate: originalDate });
  if(!isHolidayReschedule){
    const mk = currentMonthKey();
    if(!s.swapsUsed) s.swapsUsed = {};
    s.swapsUsed[mk] = (s.swapsUsed[mk] || 0) + 1;
  }
  await Promise.all([persist('overrides'), persist('extraBookings'), persist('students')]);
  await notifySwap(s, originalDate, fromWeekday, fromSlotId, target.date, toWeekday, target.slot);
}

async function notifySwap(s, fromDate, fromWeekday, fromSlotId, toDate, toWeekday, toSlotId){
  const fromSlot = slotById(fromDate, fromSlotId) || {};
  const toSlot = slotById(toDate, toSlotId) || {};
  const fromTxt = `${fmtShort(fromDate)} · ${fromSlot.start||''}–${fromSlot.end||''}`;
  const toTxt = `${fmtShort(toDate)} · ${toSlot.start||''}–${toSlot.end||''}`;
  const notifs = [{
    id: Date.now().toString() + '-g', forProfe: null, date: todayISO(),
    message: `${s.name} cambió su clase del ${fromTxt} al ${toTxt}.`
  }];
  const fromProfe = profeForSlot(fromWeekday, fromSlotId);
  const toProfe = profeForSlot(toWeekday, toSlotId);
  if(fromProfe && fromProfe !== toProfe){
    notifs.push({ id: Date.now().toString() + '-a', forProfe: fromProfe, date: todayISO(),
      message: `Se te quitó ${s.name} del turno del ${fromTxt} — movió su clase.` });
  }
  if(toProfe && toProfe !== fromProfe){
    notifs.push({ id: Date.now().toString() + '-b', forProfe: toProfe, date: todayISO(),
      message: `Se te sumó ${s.name} para el turno del ${toTxt}.` });
  }
  state.swapNotifications.push(...notifs);
  await persist('swapNotifications');
}

function passwordIssues(pw){
  if(pw.length < 6) return 'Mínimo 6 caracteres.';
  if(!/[a-zA-Z]/.test(pw) || !/[0-9]/.test(pw)) return 'Combiná letras y números.';
  return null;
}

function adminWeekHtml(){
  const base = state.session.weekBase || mondayOf(todayISO());
  state.session.weekBase = base;
  const week = [0,1,2,3,4,5].map(i => addDays(base, i));
  const allSlotIds = [...new Set([...state.config.slotsWeekday.map(s=>s.id), ...state.config.slotsSaturday.map(s=>s.id)])];
  let rowsHtml = '';
  allSlotIds.forEach(slotId => {
    let cells = '';
    week.forEach(date => {
      const slot = slotById(date, slotId);
      if(!slot){ cells += '<td>—</td>'; return; }
      const hol = isHoliday(date);
      if(hol){ cells += `<td class="holiday"><span class="muted" style="font-size:0.68rem;">feriado</span></td>`; return; }
      const names = slotOccupancy(date, slotId);
      const full = names.length >= state.config.capacity;
      const subProfe = profeForDateSlot(date, slotId);
      const isSubstituted = Object.prototype.hasOwnProperty.call(state.substitutions, substitutionKey(date, slotId));
      const cls = ['occ-cell', names.length ? 'has-people' : '', full ? 'full' : '', isSubstituted ? 'has-people' : ''].filter(Boolean).join(' ');
      cells += `<td><button type="button" class="${cls}" data-date="${date}" data-slot="${slotId}">${names.length}/${state.config.capacity}${isSubstituted ? ' *' : ''}</button></td>`;
    });
    const label = slotById(week[0], slotId) || slotById(week[5], slotId);
    rowsHtml += `<tr><th>${label ? label.start+'–'+label.end : slotId}</th>${cells}</tr>`;
  });
  return `
    <div class="row" style="margin-bottom:12px;">
      <button class="ghost" id="btn-prev-week">← semana anterior</button>
      <button class="ghost" id="btn-next-week">semana siguiente →</button>
    </div>
    <div class="card" style="overflow-x:auto;">
      <h3>${fmtLong(week[0])} — ${fmtLong(week[5])}</h3>
      <table>
        <tr><th></th>${week.map(d => `<th>${DIAS_CORTO[parseISO(d).getDay()]} ${pad(parseISO(d).getDate())}</th>`).join('')}</tr>
        ${rowsHtml}
      </table>
      <p class="hint">Tocá un turno con alumnos para ver quiénes son.</p>
    </div>
  `;
}

function openOccupancyModal(date, slotId){
  const slot = slotById(date, slotId);
  const names = slotOccupancy(date, slotId);
  const profes = profeAccounts();
  const currentProfe = profeForDateSlot(date, slotId);
  const regularProfe = profeForSlot(parseISO(date).getDay(), slotId);
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal">
      <h3>${fmtLong(date)}</h3>

      <div style="margin-top:10px;">
        ${names.map(n => `<div class="list-item">${escapeHtml(n)}</div>`).join('')}
      </div>
      ${profes.length ? `
        <div style="margin-top:14px;">
          <label>Profe de este turno, solo para este día${currentProfe && currentProfe !== regularProfe ? ' (suplente)' : ''}</label>
          <select id="sel-substitute">
            <option value="">— usar el profe habitual${regularProfe ? ' ('+regularProfe+')' : ' (sin asignar)'} —</option>

  const sel = backdrop.querySelector('#sel-substitute');
  if(sel){
    sel.onchange = async () => {
      await setSubstitution(date, slotId, sel.value || null, regularProfe);
    };
  }
}

async function setSubstitution(date, slotId, newProfe, regularProfe){
  const key = substitutionKey(date, slotId);
  if(newProfe) state.substitutions[key] = newProfe;
  else delete state.substitutions[key];
  await persist('substitutions');
  const slot = slotById(date, slotId) || {};
  const when = `${fmtShort(date)} · ${slot.start||''}–${slot.end||''}`;
  const notifs = [];
  const effectiveProfe = newProfe || regularProfe;
  if(regularProfe && regularProfe !== effectiveProfe){
    notifs.push({ id: Date.now().toString()+'-s1', forProfe: regularProfe, date: todayISO(),
      message: `Te sustituyen el ${when} — da la clase ${effectiveProfe}.` });
  }
  if(newProfe && newProfe !== regularProfe){
    notifs.push({ id: Date.now().toString()+'-s2', forProfe: newProfe, date: todayISO(),
      message: `Vas a cubrir el turno del ${when}${regularProfe ? ' en lugar de '+regularProfe : ''}.` });
  }
  if(notifs.length){
    state.swapNotifications.push(...notifs);
    await persist('swapNotifications');
  }
}

    onChange: (d, sl) => { selDay = d; selSlot = sl; }
  });
  backdrop.querySelector('#btn-cancel-form').onclick = () => backdrop.remove();
  backdrop.querySelector('#btn-save-form').onclick = async () => {
    const name = backdrop.querySelector('#f-name').value.trim();
    const pin = backdrop.querySelector('#f-pin').value.trim();
    const feeRaw = backdrop.querySelector('#f-fee').value.trim();
    const mpRaw = backdrop.querySelector('#f-mp').value.trim();
    const errEl = backdrop.querySelector('#form-err');
    errEl.innerHTML = '';
    if(!editing && name.length < 2){ errEl.innerHTML = '<p class="err">Ingresá el nombre.</p>'; return; }
    if(!pin){ errEl.innerHTML = '<p class="err">Ingresá un PIN.</p>'; return; }
    if(selDay === null || selSlot === null){ errEl.innerHTML = '<p class="err">Elegí día y horario.</p>'; return; }
    let id = sid;
    if(!editing){
      id = slugify(name);
      if(state.students[id]){ errEl.innerHTML = '<p class="err">Ya existe un alumno con ese nombre/usuario. Agregá una inicial extra para diferenciarlo (ej: "Julia Gómez B").</p>'; return; }
      state.students[id] = { id, name, pin, defaultWeekday: selDay, defaultSlotId: selSlot, swapsUsed:{}, paidMonths:{}, createdAt: todayISO() };
    } else {
      state.students[id].pin = pin;
      state.students[id].defaultWeekday = selDay;
      state.students[id].defaultSlotId = selSlot;
    }
    if(feeRaw === ''){ delete state.students[id].feeOverride; } else { state.students[id].feeOverride = Number(feeRaw); }
    if(mpRaw === ''){ delete state.students[id].mpLink; } else { state.students[id].mpLink = mpRaw; }
    await persist('students');
    backdrop.remove();
    renderAdminDashboard();
  };
}

function renderAdminHolidays(content){
  const rowsHtml = state.holidays.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(h => `
    <div class="list-item">
      <div>${fmtLong(h.date)} <span class="muted">— ${escapeHtml(h.label||'')}</span></div>
      <button class="ghost" data-del="${h.date}">quitar</button>
    </div>
  `).join('') || '<p class="muted">No hay feriados cargados.</p>';
  content.innerHTML = `
    <div class="card">
      <h3>Agregar feriado</h3>
      <div class="row">
        <div><label>Fecha</label><input type="date" id="in-hol-date"></div>
        <div><label>Motivo (opcional)</label><input id="in-hol-label" placeholder="Ej: Feriado nacional"></div>
      </div>
      <button class="primary block" id="btn-add-hol" style="margin-top:12px;">Agregar</button>
    </div>
    <div class="card"><h3>Feriados cargados</h3>${rowsHtml}</div>
  `;
  document.getElementById('btn-add-hol').onclick = async () => {
    const date = document.getElementById('in-hol-date').value;
    const label = document.getElementById('in-hol-label').value.trim();
    if(!date) return;
    if(!state.holidays.find(h=>h.date===date)) state.holidays.push({date, label});
    await persist('holidays');
    renderAdminHolidays(content);
  };
  content.querySelectorAll('[data-del]').forEach(btn => {
    btn.onclick = async () => {
      state.holidays = state.holidays.filter(h => h.date !== btn.dataset.del);
      await persist('holidays');
      renderAdminHolidays(content);
    };
  });
}

function renderAdminActivities(content){
  const rowsHtml = state.activities.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(a => `
    <div class="list-item">
      <div>
        <div style="font-weight:600;">${escapeHtml(a.title)}</div>
        <div class="muted">${fmtLong(a.date)}${a.endDate && a.endDate !== a.date ? ' — ' + fmtLong(a.endDate) : ''}</div>
        ${a.description ? `<div class="muted">${escapeHtml(a.description)}</div>` : ''}
      </div>
      <button class="ghost small" data-del="${a.id}">quitar</button>
    </div>
  `).join('') || '<p class="muted">No hay actividades cargadas.</p>';
  content.innerHTML = `
    <div class="card">
      <h3>Marcar una actividad especial</h3>
      <p class="muted">Puede durar un solo día, una semana o lo que necesites — aparece marcada en el calendario de todos los alumnos durante todo ese rango, sin afectar cupos ni clases normales.</p>
      <label>Título / temática</label>
      <input id="in-act-title" placeholder="Ej: Semana de esmaltado a mano">
      <div class="row">
        <div><label>Desde</label><input type="date" id="in-act-date"></div>
        <div><label>Hasta (opcional)</label><input type="date" id="in-act-end"></div>
      </div>
      <p class="hint">Si dejás "Hasta" vacío, la actividad dura solo ese día.</p>
      <label>Descripción / link (opcional)</label>
      <textarea id="in-act-desc" rows="2" placeholder="Detalles, o pegá un link a un PDF, fotos, etc."></textarea>
      <button class="primary block" id="btn-add-act" style="margin-top:12px;">Agregar</button>
    </div>
    <div class="card"><h3>Actividades cargadas</h3>${rowsHtml}</div>
  `;
  document.getElementById('btn-add-act').onclick = async () => {
    const date = document.getElementById('in-act-date').value;
    const endDateRaw = document.getElementById('in-act-end').value;
    const title = document.getElementById('in-act-title').value.trim();
    const description = document.getElementById('in-act-desc').value.trim();
    if(!date || !title) return;
    const endDate = endDateRaw && endDateRaw >= date ? endDateRaw : date;
    state.activities.push({ id: Date.now().toString(), date, endDate, title, description });
    await persist('activities');
    renderAdminActivities(content);
  };
  content.querySelectorAll('[data-del]').forEach(btn => {
    btn.onclick = async () => {
      state.activities = state.activities.filter(a => a.id !== btn.dataset.del);
      await persist('activities');
      renderAdminActivities(content);
    };
  });
}

function renderAdminAnnouncements(content){
  const rowsHtml = state.announcements.slice().reverse().map(a => `
    <div class="list-item">
      <div><div class="muted">${fmtLong(a.date)}</div>${escapeHtml(a.message)}</div>
      <button class="ghost" data-del="${a.id}">quitar</button>
    </div>
  `).join('') || '<p class="muted">No hay avisos.</p>';
  content.innerHTML = `
    <div class="card">
      <h3>Información fija</h3>
      <p class="muted">Esto queda siempre visible arriba de todo en el celular del alumno — a diferencia de los avisos, no se acumula ni desaparece. Sirve para un link a un PDF, el material del mes, o algo que quieras que estén viendo siempre.</p>
      <textarea id="in-student-info" rows="4" placeholder="Ej: Material de este mes: [link]. Este viernes hay jornada especial de esmaltado.">${escapeHtml(state.studentInfo || '')}</textarea>
      <button class="primary block" id="btn-save-info" style="margin-top:12px;">Guardar</button>
    </div>
    <div class="card">
      <h3>Nuevo aviso</h3>
      <textarea id="in-announce" rows="3" placeholder="Escribí el comunicado para los alumnos…"></textarea>
      <button class="primary block" id="btn-add-announce" style="margin-top:12px;">Publicar</button>
    </div>
    <div class="card"><h3>Avisos publicados</h3>${rowsHtml}</div>
  `;
  document.getElementById('btn-save-info').onclick = async () => {
    state.studentInfo = document.getElementById('in-student-info').value.trim();
    await persist('studentInfo');
  };
  document.getElementById('btn-add-announce').onclick = async () => {
    const message = document.getElementById('in-announce').value.trim();
    if(!message) return;
    state.announcements.push({ id: Date.now().toString(), date: todayISO(), message });
    await persist('announcements');
    renderAdminAnnouncements(content);
  };
  content.querySelectorAll('[data-del]').forEach(btn => {
    btn.onclick = async () => {
      state.announcements = state.announcements.filter(a => a.id !== btn.dataset.del);
      await persist('announcements');
      renderAdminAnnouncements(content);
    };
  });
}

function renderAdminProfes(content){
  const rowsHtml = Object.values(state.admins).sort((a,b) => a.username.localeCompare(b.username)).map(a => `
    <div class="list-item">
      <div>
        <div style="font-weight:600;">${a.username} ${a.role==='owner' ? '<span class="badge-role">dueño/a</span>' : '<span class="badge-role">profe</span>'}</div>
        <div class="muted">creado ${a.createdAt}</div>
      </div>
      <div style="display:flex; flex-direction:column; gap:6px; align-items:flex-end;">
        ${a.role !== 'owner' ? `<button class="ghost small" data-reset="${a.username}">Resetear contraseña</button>` : ''}
        ${a.username !== state.session.username ? `<button class="danger small" data-del="${a.username}">Eliminar</button>` : '<span class="muted">vos</span>'}
      </div>
    </div>
  `).join('');
  content.innerHTML = `
    <div class="card">
      <h3>Agregar profe</h3>
      <label>Usuario</label>
      <input id="f-prof-user" autocapitalize="none">
      <label>Contraseña</label>
      <input id="f-prof-pass" type="password">
      <p class="hint">Mínimo 6 caracteres, combinando letras y números.</p>
      <div id="prof-err"></div>
      <button class="primary block" id="btn-add-prof" style="margin-top:12px;">Crear cuenta de profe</button>
    </div>
    <div class="card"><h3>Cuentas del equipo</h3>${rowsHtml}</div>
  `;
  document.getElementById('btn-add-prof').onclick = async () => {
    const username = document.getElementById('f-prof-user').value.trim().toLowerCase();
    const pass = document.getElementById('f-prof-pass').value;
    const errEl = document.getElementById('prof-err');
    errEl.innerHTML = '';
    if(username.length < 3){ errEl.innerHTML = '<p class="err">Elegí un usuario de al menos 3 caracteres.</p>'; return; }
    if(state.admins[username]){ errEl.innerHTML = '<p class="err">Ya existe una cuenta con ese usuario.</p>'; return; }
    const issue = passwordIssues(pass);
    if(issue){ errEl.innerHTML = `<p class="err">${issue}</p>`; return; }
    const passwordHash = await sha256(pass);
    state.admins[username] = { username, passwordHash, role:'profe', createdAt: todayISO() };
    await persist('admins');
    renderAdminProfes(content);
  };
  content.querySelectorAll('[data-reset]').forEach(btn => {
    btn.onclick = () => openResetProfePasswordModal(btn.dataset.reset, content);
  });
  content.querySelectorAll('[data-del]').forEach(btn => {
    btn.onclick = async () => {
      if(!confirm(`¿Eliminar la cuenta de ${btn.dataset.del}?`)) return;
      delete state.admins[btn.dataset.del];
      await persist('admins');
      renderAdminProfes(content);
    };
  });
}

function openResetProfePasswordModal(username, content){
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal">
      <h3>Resetear contraseña de ${username}</h3>
      <label>Contraseña nueva</label>
      <input id="rp-pass" type="password">
      <p class="hint">Mínimo 6 caracteres, combinando letras y números.</p>
      <div id="rp-err"></div>
      <div class="row" style="margin-top:16px;">
        <button class="ghost block" id="rp-cancel">Cancelar</button>
        <button class="primary block" id="rp-save">Guardar</button>
      </div>
    </div>
  `;
  document.body.appendChild(backdrop);
  backdrop.querySelector('#rp-cancel').onclick = () => backdrop.remove();
  backdrop.querySelector('#rp-save').onclick = async () => {
    const pass = backdrop.querySelector('#rp-pass').value;
    const errEl = backdrop.querySelector('#rp-err');
    const issue = passwordIssues(pass);
    if(issue){ errEl.innerHTML = `<p class="err">${issue}</p>`; return; }
    state.admins[username].passwordHash = await sha256(pass);
    await persist('admins');
    backdrop.remove();
    renderAdminProfes(content);
  };
}

function renderAdminConfig(content){
  const c = state.config;
  content.innerHTML = `
    <div class="card">
      <h3>Paleta de colores</h3>
      <div class="theme-grid" id="theme-grid">
        ${Object.keys(THEMES).map(key => {
          const t = THEMES[key];
          return `<div class="theme-card ${c.theme===key?'selected':''}" data-theme="${key}">
            <div class="theme-swatch">
              <span style="background:${t.bg}"></span><span style="background:${t.glaze}"></span><span style="background:${t.oxide}"></span><span style="background:${t.ink}"></span>
            </div>
            <div class="theme-name">${t.name}</div>
          </div>`;
        }).join('')}
      </div>
    </div>
    <div class="card">
      <h3>Turnos de lunes a viernes</h3>
      <div id="wd-slots"></div>
      <button class="ghost" id="btn-add-wd">+ agregar turno</button>
    </div>
    <div class="card">
      <h3>Turnos de sábado</h3>
      <div id="sat-slots"></div>
      <button class="ghost" id="btn-add-sat">+ agregar turno</button>
    </div>
    <div class="card" id="profes-por-turno-card">
      <h3>Profe a cargo de cada turno</h3>
      <p class="muted">Así los alumnos ven quién les da clase, y cada profe ve solo sus alumnos en la pestaña Alumnos. Opcional.</p>
      <div id="slot-assign-list" style="margin-top:10px;"></div>
    </div>
    <div class="card">
      <h3>Reglas y cuota</h3>
      <label>Cupo por turno</label>
      <input type="number" id="in-capacity" value="${c.capacity}">
      <label>Clases por ciclo (informativo)</label>
      <input type="number" id="in-cycle" value="${c.classesPerCycle}">
      <label>Cambios permitidos por mes</label>
      <input type="number" id="in-swaps" value="${c.swapsPerMonth}">
      <div class="row">
        <div><label>Pago desde el día</label><input type="number" id="in-pay-start" value="${c.paymentWindowStart}"></div>
        <div><label>hasta el día</label><input type="number" id="in-pay-end" value="${c.paymentWindowEnd}"></div>
      </div>
      <label>Cuota mensual por defecto</label>
      <input type="number" id="in-fee" value="${c.monthlyFee}">
      <label>Los avisos se muestran a los alumnos durante (días)</label>
      <input type="number" id="in-announce-days" value="${c.announcementVisibleDays}">
      <p class="hint">Pasados esos días, el aviso deja de aparecer en el home del alumno — pero vos seguís viéndolo en esta pestaña.</p>
      <label>PIN por defecto para alumnos nuevos</label>
      <input id="in-default-pin" value="${c.defaultStudentPin}" maxlength="4">
      <label>Tu WhatsApp (para avisos rápidos, sin el +, ej: 5491122334455)</label>
      <input id="in-whatsapp" value="${c.profeWhatsapp || ''}" placeholder="5491122334455">
      <p class="hint">Si lo cargás, cuando un alumno pida restablecer su PIN le va a aparecer un botón para avisarte directo por WhatsApp.</p>
      <label>Link de cobro de Mercado Pago (general)</label>
      <input id="in-mp" placeholder="https://mpago.la/..." value="${c.mpLink || ''}">
      <p class="hint">Generá este link desde tu cuenta de Mercado Pago (Link de pago o Punto de venta). El alumno paga ahí y vos confirmás acá con "Marcar pagado" — ver la nota sobre cobro automático más abajo.</p>
      <button class="primary block" id="btn-save-config" style="margin-top:14px;">Guardar configuración</button>
    </div>
  `;
  content.querySelectorAll('[data-theme]').forEach(el => {
    el.onclick = async () => {
      c.theme = el.dataset.theme;
      applyTheme(c.theme);
      await persist('config');
      renderAdminConfig(content);
    };
  });
  renderSlotEditor('wd-slots', 'slotsWeekday');
  renderSlotEditor('sat-slots', 'slotsSaturday');
  renderSlotAssignments();
  document.getElementById('btn-add-wd').onclick = () => addSlot('slotsWeekday');
  document.getElementById('btn-add-sat').onclick = () => addSlot('slotsSaturday');
  document.getElementById('btn-save-config').onclick = async () => {
    c.capacity = parseInt(document.getElementById('in-capacity').value,10) || c.capacity;
    c.classesPerCycle = parseInt(document.getElementById('in-cycle').value,10) || c.classesPerCycle;
    c.swapsPerMonth = parseInt(document.getElementById('in-swaps').value,10) || c.swapsPerMonth;
    c.paymentWindowStart = parseInt(document.getElementById('in-pay-start').value,10) || c.paymentWindowStart;
    c.paymentWindowEnd = parseInt(document.getElementById('in-pay-end').value,10) || c.paymentWindowEnd;
    c.monthlyFee = parseInt(document.getElementById('in-fee').value,10) || c.monthlyFee;
    c.announcementVisibleDays = parseInt(document.getElementById('in-announce-days').value,10) || c.announcementVisibleDays;
    c.defaultStudentPin = document.getElementById('in-default-pin').value.trim() || c.defaultStudentPin;
    c.profeWhatsapp = document.getElementById('in-whatsapp').value.trim().replace(/[^0-9]/g, '');
    c.mpLink = document.getElementById('in-mp').value.trim();
    await persist('config');
    renderAdminConfig(content);
  };

  function renderSlotEditor(containerId, key){
    const el = document.getElementById(containerId);
    el.innerHTML = c[key].map((s,i) => `
      <div class="row" style="margin-bottom:8px; align-items:flex-end;">
        <div><label>Desde</label><input type="time" data-key="${key}" data-idx="${i}" data-field="start" value="${s.start}"></div>
        <div><label>Hasta</label><input type="time" data-key="${key}" data-idx="${i}" data-field="end" value="${s.end}"></div>
        <button class="ghost" data-remove="${key}:${i}">✕</button>
      </div>
    `).join('');
    el.querySelectorAll('input[data-key]').forEach(inp => {
      inp.onchange = async () => {
        c[inp.dataset.key][inp.dataset.idx][inp.dataset.field] = inp.value;
        await persist('config');
      };
    });
    el.querySelectorAll('[data-remove]').forEach(btn => {
      btn.onclick = async () => {
        const [key, idx] = btn.dataset.remove.split(':');
        c[key].splice(parseInt(idx,10),1);
        await persist('config');
        renderAdminConfig(content);
      };
    });
  }
  async function addSlot(key){
    c[key].push({ id: key.slice(0,1)+Date.now().toString().slice(-5), start:'09:00', end:'11:00' });
    await persist('config');
    renderAdminConfig(content);
  }
  function renderSlotAssignments(){
    const el = document.getElementById('slot-assign-list');
    const profes = profeAccounts();
    if(!profes.length){
      el.innerHTML = '<p class="muted">Todavía no hay cuentas de profe creadas — pedile al dueño/a que cree una en su panel.</p>';
      return;
    }
    let rows = '';
    [1,2,3,4,5,6].forEach(wd => {
      slotsForWeekday(wd).forEach(slot => {
        const key = slotAssignmentKey(wd, slot.id);
        const current = state.slotAssignments[key] || '';
        rows += `
          <div class="row" style="margin-bottom:8px; align-items:center;">
            <div class="muted" style="flex:1.2;">${DIAS_CORTO[wd]} · ${slot.start}–${slot.end}</div>
            <select data-assign-key="${key}" style="flex:1;">
              <option value="">Sin asignar</option>
              ${profes.map(p => `<option value="${p.username}" ${current===p.username?'selected':''}>${p.username}</option>`).join('')}
            </select>
          </div>`;
      });
    });
    el.innerHTML = rows;
    el.querySelectorAll('[data-assign-key]').forEach(sel => {
      sel.onchange = async () => {
        if(sel.value) state.slotAssignments[sel.dataset.assignKey] = sel.value;
        else delete state.slotAssignments[sel.dataset.assignKey];
        await persist('slotAssignments');
      };
    });
  }
}

// ---------- boot ----------
(async function init(){
  await loadAll();
  render();
})();
</script>
</body>
</html>
